<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電話採点">
<title>電話応対 実技（教員用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#1E3350; --ink-soft:#4E6280;
  --rule:#CBD3DE; --tint:#E7EEF7; --red:#C2332B; --red-soft:#FBE9E7;
  --ok:#2F6F57; --ok-soft:#E4F1EB; --amber:#8A5A00; --amber-soft:#FFF3D6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121A26; --sheet:#1A2433; --ink:#E3EAF4; --ink-soft:#9FB0C6;
    --rule:#33425A; --tint:#22314A; --red:#FF7A6E; --red-soft:#3A2224;
    --ok:#7FD1AE; --ok-soft:#1D3329; --amber:#F2C46B; --amber-soft:#3A2F17;
  }
}
:root[data-theme="dark"]{
  --paper:#121A26; --sheet:#1A2433; --ink:#E3EAF4; --ink-soft:#9FB0C6;
  --rule:#33425A; --tint:#22314A; --red:#FF7A6E; --red-soft:#3A2224;
  --ok:#7FD1AE; --ok-soft:#1D3329; --amber:#F2C46B; --amber-soft:#3A2F17;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;line-height:1.7}
h1,h2,h3{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
header.top h1{margin:0;font-size:clamp(1.3rem,2.6vw,1.75rem);font-weight:900;letter-spacing:.04em}

.layout{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px}
.panel h2{font-size:1rem;margin:0 0 10px;font-weight:700}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
@media (max-width:860px){.side{position:static}}

/* segmented controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{cursor:pointer;border:0;background:var(--sheet);padding:8px 6px;font-weight:700;line-height:1.3}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg.round button{padding:12px 6px;font-size:1.05rem}
.seg.round small{display:block;font-weight:400;font-size:.78rem;opacity:.85}

/* org chart picker */
.org{display:flex;flex-direction:column;align-items:center}
.org .trunk{width:2px;height:14px;background:var(--rule)}
.org .branches{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px;width:100%;position:relative;padding-top:14px}
.org .branches::before{content:"";position:absolute;top:0;left:calc(50% / var(--n,2));right:calc(50% / var(--n,2));height:2px;background:var(--rule)}
.sheetsel{width:100%;padding:8px;border:1.5px solid var(--ink);border-radius:5px;background:var(--sheet);font-weight:700}
.org .branch{display:flex;flex-direction:column;gap:6px;position:relative}
.org .branch::before{content:"";position:absolute;top:-14px;left:50%;width:2px;height:14px;background:var(--rule)}
.org .ka{text-align:center;font-weight:700;font-size:.85rem;color:var(--ink-soft);margin-bottom:2px}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--sheet);border:1.5px solid var(--rule);border-radius:5px;padding:5px 7px;line-height:1.3}
.pbtn .nm{font-size:.92rem}
.pbtn:hover{border-color:var(--ink-soft)}
.pbtn .nm{font-weight:700}
.pbtn .st{font-size:.7rem;color:var(--ink-soft)}
.pbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.pbtn[aria-pressed="true"] .st{color:var(--sheet);opacity:.85}
.pbtn.top{max-width:160px;align-items:center;text-align:center}
.self{border:1.5px dashed var(--rule);border-radius:5px;padding:5px 7px;font-size:.85rem;color:var(--ink-soft);line-height:1.35}
.rand{margin-top:12px;width:100%;cursor:pointer;background:transparent;border:1.5px solid var(--ink);border-radius:5px;padding:8px;font-weight:700}
.rand:hover{background:var(--tint)}

.fl{display:block;font-size:.85rem;color:var(--ink-soft);margin:0 0 4px}
label.f{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:8px}
label.f input{display:block;width:100%;margin-top:3px;padding:7px 9px;border:1.5px solid var(--rule);border-radius:5px;background:var(--paper)}
.hint{font-size:.78rem;color:var(--ink-soft);margin:6px 0 0}

/* main */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.callcard{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;
  background:var(--tint);border:1px solid var(--rule);border-radius:6px;padding:12px 16px}
.callcard dl{margin:0;display:flex;flex-wrap:wrap;gap:4px 28px}
.callcard dt{font-size:.75rem;color:var(--ink-soft)}
.callcard dd{margin:0;font-weight:700;font-size:1.15rem}
.callcard dd small{font-weight:400;font-size:.8rem;color:var(--ink-soft);margin-left:6px}
.btn{cursor:pointer;background:var(--sheet);border:1.5px solid var(--ink);border-radius:5px;padding:7px 12px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--paper)}
@media (max-width:520px){.callcard{grid-template-columns:1fr}}

.status{display:grid;gap:10px}
.status .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.status .who{font-size:1.4rem;font-weight:900;margin:0 6px 0 0}
.badge{display:inline-block;font-weight:700;font-size:.88rem;padding:2px 10px;border-radius:4px;
  background:var(--red-soft);color:var(--red);border:1px solid currentColor}
.badge.msg{background:var(--ok-soft);color:var(--ok)}
.status .sit{margin:0}
.msgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msgbar select{padding:6px 8px;border:1.5px solid var(--ink);border-radius:5px;background:var(--sheet);max-width:100%}
.checks{margin:0;padding:10px 12px 10px 30px;background:var(--amber-soft);border-radius:5px;font-size:.92rem}
.checks li::marker{color:var(--amber)}

/* script */
.script{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.script .cols{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);color:var(--sheet);font-weight:700;text-align:center}
.script .cols div{padding:6px}
.row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.row .cell{padding:10px 14px}
.row .cell + .cell{border-left:1px solid var(--rule)}
.row.call .c2{background:var(--tint);font-weight:700;font-size:1.05rem}
.row.call.msg .c2{border-left:4px solid var(--ok)}
.row .tag{display:none}
.row .alt{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:700}
.hold{border-top:2px solid var(--ink);background:var(--paper);text-align:center;font-size:.85rem;color:var(--ink-soft);padding:5px}
.v{background:linear-gradient(transparent 62%, var(--tint) 62%);padding:0 1px}
.row.call .c2 .v{background:none;text-decoration:underline dotted;text-underline-offset:3px}
.u{text-decoration:underline 2px var(--red);text-underline-offset:4px;color:var(--red);font-weight:700}
.u .v{background:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.8rem;color:var(--ink-soft);margin-top:-6px}

@media (max-width:620px){
  .script .cols{display:none}
  .row{grid-template-columns:1fr}
  .row .cell:empty{display:none}
  .row .cell + .cell{border-left:0}
  .row .tag{display:block;font-size:.72rem;font-weight:700;color:var(--ink-soft);margin-bottom:2px}
  .row.call .c2{border-left:4px solid var(--ink)}
}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft)}
/* 教員用：伝言の制限 */
.mfilter{display:grid;grid-template-columns:1fr;gap:2px}
.mf{display:flex;gap:8px;align-items:center;font-size:.88rem;padding:3px 4px;border-radius:4px;cursor:pointer}
.mf:hover{background:var(--tint)}
.mf input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.mfbtns{margin-top:8px}
/* 教員用：採点 */
.script.t .cols,.script.t .row{grid-template-columns:1fr 112px 1fr}
.script.t .row .cell.cm{padding:8px 6px;display:flex;align-items:flex-start;justify-content:center}
.marks{display:flex;gap:4px}
.mk{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;
  font-weight:700;font-size:1rem;line-height:1;padding:0;color:var(--ink-soft)}
.mk:hover{border-color:var(--ink-soft)}
.mk-o[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.mk-t[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--sheet)}
.mk-x[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--sheet)}
.row.recv.m-o .c1{box-shadow:inset 4px 0 0 var(--ok)}
.row.recv.m-t .c1{box-shadow:inset 4px 0 0 var(--amber)}
.row.recv.m-x .c1{box-shadow:inset 4px 0 0 var(--red)}
.tallybar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:700;font-size:1.05rem}
.tk.o{color:var(--ok)} .tk.t{color:var(--amber)} .tk.x{color:var(--red)}
.tk:last-child{color:var(--ink-soft);font-weight:400;font-size:.9rem;align-self:center}
@media (max-width:620px){
  .script.t .row{grid-template-columns:1fr}
  .script.t .row .cell.cm:empty,.script.t .row.call .cell.cm{display:none}
  .script.t .row .cell.cm{justify-content:flex-start;padding:0 14px 10px}
}

/* iPad などタッチ操作向け */
html{-webkit-text-size-adjust:100%}
button,label.mf,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (pointer:coarse){
  .pbtn{padding:8px 8px;min-height:48px}
  .seg button{min-height:46px}
  .btn,.rand,.sheetsel,.msgbar select{min-height:44px}
  label.f input{min-height:44px;font-size:16px}
  .mf{padding:8px 6px}
  .mf input{width:22px;height:22px}
  .mk{width:44px;height:44px;font-size:1.15rem}
  .script.t .cols,.script.t .row{grid-template-columns:1fr 156px 1fr}
  .marks{gap:6px}
}
@media (pointer:coarse) and (max-width:620px){
  .script.t .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>電話応対 実技　かける側のセリフ</h1></header>

  <div class="layout">
    <aside class="side">
      <section class="panel">
        <h2>状況設定シート</h2>
        <select id="sheetSel" class="sheetsel" aria-label="状況設定シート"></select>
      </section>

      <section class="panel">
        <h2>実技の回</h2>
        <div class="seg round" id="roundSeg" role="group" aria-label="実技の回">
          <button type="button" data-r="1" aria-pressed="true">1回目<small>折り返しを頼む</small></button>
          <button type="button" data-r="2" aria-pressed="false">2回目<small>伝言を頼む</small></button>
        </div>
      </section>

      <section class="panel">
        <h2>呼び出す人を選ぶ</h2>
        <div class="org" id="org"></div>
        <button class="rand" id="randPerson" type="button">ランダムに選ぶ</button>
      </section>

      <section class="panel">
        <h2>かける側の会社名</h2>
        <div class="seg" id="lenSeg" role="group" aria-label="会社名の長さ">
          <button type="button" data-l="s" aria-pressed="true">短い</button>
          <button type="button" data-l="m" aria-pressed="false">中くらい</button>
          <button type="button" data-l="l" aria-pressed="false">長い</button>
        </div>
        <p class="hint">会社名・名前・電話番号（全国）は、人を選ぶたびにランダムで決まります。</p>
      </section>

      <section class="panel">
        <h2>受ける側</h2>
        <label class="f">内定先企業名<input id="stuCo" type="text" placeholder="未入力なら【内定先企業名】"></label>
        <label class="f">自分の名前<input id="stuName" type="text" placeholder="未入力なら【自分の名前】"></label>
        <p class="hint">入力は任意です。セリフ内の表示が変わるだけです。</p>
      </section>
    </aside>

    <main class="main" id="main">
      <div class="panel empty">左の組織図から、電話で呼び出す人を選んでください。</div>
    </main>
  </div>
</div>

<script>

function makeCompany(len){
  const gen = {
    s: () => pick(S_PRE) + pick(S_SUF),
    m: () => pick(M_WORD) + pick(M_BIZ),
    l: () => Math.random() < .6 ? pick(L_REG) + pick(L_K1) + pick(L_K2) : pick(L_REG) + pick(L_MID) + pick(L_BIZ)
  }[len];
  const ok = { s: n => n <= 5, m: n => n >= 8 && n <= 12, l: n => n >= 15 }[len];
  let name; do { name = gen(); } while (!ok(name.length));
  return name;
}

function makeDay(sh, exclude){
  const wd = d => (sh.wd + d - sh.today + 70) % 7;
  let d;
  do { d = rint(sh.today + 1, sh.last); } while ([0,6].includes(wd(d)) || d === exclude);

let marks = {};

function newCaller(){ state.caller = {co:makeCompany(state.len), name:pick(SURNAMES), ...makeTel()}; }
function newVals(){
  const sh = state.sheet, a = makeDay(sh), b = makeDay(sh, a.d);
  let t1 = makeTime(), t2 = makeTime(); while (t2 === t1) t2 = makeTime();
  const qty = () => rint(2, 60) * 5;
  const q1 = qty(); let q2 = qty(); while (q2 === q1) q2 = qty();
  state.vals = {d1:a.text, d2:b.text, t1, t2, tel2:makeTel().tel, mob:makeMobile(), q1, q2, q3:qty(), ppl:rint(2, 9)};
}

  if (state.msgSel !== 'random' && !enabled.includes(Number(state.msgSel))) state.msgSel = 'random';
  state.msgIdx = state.msgSel === 'random' ? pick(enabled) : Number(state.msgSel);
  newVals(); resetMarks();
}

function pbtn(p, extra=''){
  return `<button type="button" class="pbtn ${extra}" data-id="${p.id}" aria-pressed="${state.person===p}">
    <span class="nm">${p.name}${p.title || 'さん'}</span><span class="st">${p.short}</span></button>`;

function renderOrg(){
  const sh = state.sheet, n = sh.branches.length;
  const top = sh.people.find(p => p.dept === sh.top.dept);
  const org = document.getElementById('org');
  org.style.setProperty('--n', n);
  org.innerHTML = `
    ${top ? pbtn(top,'top') : ''}
    <div class="trunk"></div>
    <div class="branches">
      ${sh.branches.map(b => `<div class="branch"><div class="ka">${b}</div>
        ${sh.people.filter(p=>p.dept===b).map(p=>pbtn(p)).join('')}
        ${b === sh.myDept ? '<div class="self">あなた<br>在席中</div>' : ''}</div>`).join('')}
    </div>`;
  org.querySelectorAll('.pbtn').forEach(b=>b.addEventListener('click',()=>selectPerson(b.dataset.id)));
}
function selectPerson(id){
  state.person = state.sheet.people.find(p=>p.id===id);
  newCaller(); newMessage();
  renderOrg(); render();
  if (window.matchMedia('(max-width:860px)').matches) document.getElementById('main').scrollIntoView({behavior:'smooth'});
}

  const m = p.pattern;
  const back = u(`${who}が戻りましたらお電話を差し上げるよう確かに申し伝えます`);
  if (m === '1') return [u(`ただ今外出いたしております。${v(p.time)}時には戻る予定でございます`),
    u('戻り次第こちらから、お電話を差し上げましょうか'), back];
  if (m === '2' || m === '3'){
    const kind = m === '2' ? '休暇中' : '出張中';
    return [u(`${kind}でございます。${v(p.day)}日には出勤の予定でございます`),
      u(`${v(p.day)}日にこちらから、お電話を差し上げましょうか`),
      u(`${v(p.day)}日に${who}からお電話を差し上げるよう確かに申し伝えます`)];
  }
  if (m === '4') return [u('ただ今席を外しております') + (p.time ? u(`。${v(p.time)}時には戻る予定でございます`) : ''),
    u('戻り次第こちらから、お電話を差し上げましょうか'), back];
  return [u('ただ今他の電話に出ております'),
    u('電話が終わり次第こちらから、お電話を差し上げましょうか'),
    u(`電話が終わり次第${who}からお電話を差し上げるよう確かに申し伝えます`)];
}

function buildScript(p){
  const sh = state.sheet;
  const coIn = document.getElementById('stuCo').value.trim();
  const nmIn = document.getElementById('stuName').value.trim();
  const co = v(coIn ? esc(coIn) : '【内定先企業名】');
  const me = v(nmIn ? esc(nmIn) : '【自分の名前】');
  const c = state.caller;
  const cc = v(c.co), cn = v(c.name), tel = v(c.tel);
  const who = v(p.name), dept = v(p.dept);
  const myself = (p.dept === sh.myDept ? u('同じ') : '') + sh.myDept;
  const R = (t, o={}) => ({s:'r', t, ...o}), C = (t, o={}) => ({s:'c', t, ...o});
  const [absent, offer, promise] = statusLines(p, who);

  const head = [
    R(`「はい、${co}でございます」`),
    C(`「私、${cc}の${cn}と申します。いつもお世話になっております」`),
    R('「いつも（こちらこそ）お世話になっております」'),
    C(`「恐れ入りますが、${dept}の${who}様いらっしゃいますでしょうか」`),
    R(`「${dept}の${who}でございますね。かしこまりました。少々お待ちくださいませ」`)
  ];
  const opening = [
    R('「お待たせいたしました」'),
    R(`「申し訳ございません。あいにくではございますが、${who}は、${absent}」`),
    R(`「お差し支えなければ、${offer}」`)
  ];

  if (state.round === '1'){
    return {head, body:[...opening,
      C('「それでは、申し訳ございませんがよろしくお願いいたします」'),
      R('「かしこまりました。恐れ入りますが、念のためお電話番号をお聞かせ願えませんでしょうか」'),
      C(`「はい、${tel}です」`),
      R(`「かしこまりました。それでは確認させていただきます。${tel}、${cc}の${cn}様でいらっしゃいますね」`),
      C('「はい」'),
      R(`「私、${myself}の${me}と申します。${promise}」`),
      C('「では、よろしくお願いいたします」'),
      R('「失礼いたします」')
    ]};
  }

  const x = state.vals;
  const msg = MESSAGES[state.msgIdx].build({
    d1:v(x.d1), d2:v(x.d2), t1:v(x.t1), t2:v(x.t2), tel2:v(x.tel2), mob:v(x.mob),
    q1:v(x.q1), q2:v(x.q2), q3:v(x.q3), ppl:v(x.ppl), n:who, ext:v(p.ext)
  });
  const reps = msg.rep.map((r, i) => i === 0
    ? R(`「かしこまりました。それでは確認させていただきます。${u(r)}」`, {alt:'復唱例'})
    : R(`「${u(r)}」`, {alt:'または'}));
  return {head, body:[...opening,
    C('「それでは、申し訳ございませんが伝言をお願いできますか」'),
    R('「かしこまりました。お願いいたします」'),
    ...msg.call.map(t => C(t, {msg:true})),
    ...reps,
    C('「はい、結構です」'),
    R(`「${cc}の${cn}様でいらっしゃいますね」`),
    C('「はい」'),
    R(`「私、${myself}の${me}と申します。${u(`確かに${who}へ申し伝えます`)}」`),
    C('「では、よろしくお願いいたします」'),
    R('「失礼いたします」')
  ]};
}

const MARKS = [['o','○'],['t','△'],['x','×']];
function markCell(i){
  if (!TEACHER) return '';
  if (i == null) return '<div class="cell cm"></div>';
  return `<div class="cell cm"><div class="marks" role="group" aria-label="採点">${MARKS.map(([k,s]) =>
    `<button type="button" class="mk mk-${k}" data-i="${i}" data-k="${k}" aria-pressed="${marks[i]===k}" aria-label="${s}">${s}</button>`).join('')}</div></div>`;
}
let recvCount = 0;
function rowHTML(l){
  const alt = l.alt ? `<span class="alt">${l.alt}</span>` : '';
  if (l.s === 'r'){
    const i = recvCount++;
    return `<div class="row recv ${marks[i] ? 'm-' + marks[i] : ''}" data-row="${i}"><div class="cell c1"><span class="tag">受ける側</span>${alt}${l.t}</div>${markCell(i)}<div class="cell c2"></div></div>`;
  }
  return `<div class="row call ${l.msg?'msg':''}"><div class="cell c1"></div>${markCell(null)}<div class="cell c2"><span class="tag">かける側</span>${l.t}</div></div>`;
}
function tally(){
  const total = document.querySelectorAll('.row.recv').length;
  const n = k => Object.values(marks).filter(x => x === k).length;
  const el = document.getElementById('tally');
  if (el) el.innerHTML = `<span class="tk o">○ ${n('o')}</span><span class="tk t">△ ${n('t')}</span><span class="tk x">× ${n('x')}</span><span class="tk">未採点 ${total - Object.keys(marks).length}</span>`;
}

/* ================= 描画 ================= */
const EMPTY = '<div class="panel empty">左の組織図から、電話で呼び出す人を選んでください。</div>';
function render(){
  const p = state.person, main = document.getElementById('main');
  if (!p){ main.innerHTML = EMPTY; return; }
  const c = state.caller, r2 = state.round === '2';
  const sc = buildScript(p);
  const label = p.name + (p.title || 'さん');

  const checks = [...p.checks];
  if (r2){
    checks.push('伝言の内容（日時・数字・番号）を正しく復唱できているか');
    checks.push('相手の会社名と名前を確認できているか');
  } else {
    checks.push('電話番号・会社名・名前を正しく復唱できているか');
  }
  checks.push(`社外に対して「${label}」と呼ばず、「${p.name}」と言えているか`);
  if (p.dept === state.sheet.myDept) checks.push(`同じ課なので「同じ${state.sheet.myDept}の〜」と名乗れているか`);

  const opts = ['<option value="random">ランダム</option>']
    .concat(enabled.slice().sort((a,b)=>a-b).map(i=>`<option value="${i}">${CIRCLED[i]} ${MESSAGES[i].title}</option>`)).join('');
  recvCount = 0;
  const headRows = sc.head.map(rowHTML).join(''), bodyRows = sc.body.map(rowHTML).join('');

  main.innerHTML = `
    <section class="callcard" aria-label="かける側の情報">
      <dl>
        <div><dt>かける側の会社名</dt><dd>${c.co}</dd></div>
        <div><dt>かける側の名前</dt><dd>${c.name}</dd></div>
        ${r2 ? '' : `<div><dt>電話番号</dt><dd>${c.tel}<small>${c.city}</small></dd></div>`}
      </dl>
      <button class="btn" id="reroll" type="button">会社名と名前を変える</button>
    </section>

    <section class="panel status">
      <div class="head">
        <h2 class="who">${p.dept}　${label}</h2>
        <span class="badge">${PATTERN_NAME[p.pattern]}</span>
        ${r2 ? `<span class="badge msg">伝言${CIRCLED[state.msgIdx]}　${MESSAGES[state.msgIdx].title}</span>` : ''}
      </div>
      <p class="sit">状況：${p.status}</p>
      ${r2 ? `<div class="msgbar">
        <select id="msgSel" aria-label="伝言の内容">${opts}</select>
        <button class="btn" id="msgNext" type="button">別の伝言にする</button>
      </div>` : ''}
      <ul class="checks">${checks.map(x=>`<li>${x}</li>`).join('')}</ul>
    </section>

    <div class="legend"><span><span class="u">赤い下線</span>…状況によって変わる大事な部分</span><span>色の濃い列…かける側のセリフ</span></div>

    ${TEACHER ? `<div class="tallybar"><div id="tally" class="tally"></div><button class="btn" id="markReset" type="button">採点をリセット</button></div>` : ''}

    <section class="script ${TEACHER ? 't' : ''}" aria-label="セリフ">
      <div class="cols"><div>受ける側</div>${TEACHER ? '<div>採点</div>' : ''}<div>かける側</div></div>
      ${headRows}
      <div class="hold">保留</div>
      ${bodyRows}
    </section>`;

  if (TEACHER){
    tally();
    document.getElementById('markReset').addEventListener('click',()=>{resetMarks(); render();});
    main.querySelectorAll('.mk').forEach(b=>b.addEventListener('click',()=>{
      const i = b.dataset.i, k = b.dataset.k;
      if (marks[i] === k) delete marks[i]; else marks[i] = k;
      const row = main.querySelector(`.row[data-row="${i}"]`);
      row.classList.remove('m-o','m-t','m-x'); if (marks[i]) row.classList.add('m-' + marks[i]);
      row.querySelectorAll('.mk').forEach(x=>x.setAttribute('aria-pressed', marks[i] === x.dataset.k));
      tally();
    }));
  }

  document.getElementById('reroll').addEventListener('click',()=>{newCaller();render();});
  if (r2){
    const sel = document.getElementById('msgSel');
    sel.value = state.msgSel;
    sel.addEventListener('change',()=>{state.msgSel = sel.value; newMessage(); render();});
    document.getElementById('msgNext').addEventListener('click',()=>{
      if (state.msgSel === 'random' && enabled.length > 1){
        let i; do { i = pick(enabled); } while (i === state.msgIdx);
        state.msgIdx = i;
      }
      newVals(); resetMarks(); render();
    });
  }
}

function bindSeg(id, attr, key, after){
  const seg = document.getElementById(id);
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    state[key] = b.dataset[attr];
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    after();
  }));
}
bindSeg('roundSeg','r','round',()=>{resetMarks(); render();});
bindSeg('lenSeg','l','len',()=>{ if (state.person){ newCaller(); render(); } });

const sheetSel = document.getElementById('sheetSel');
sheetSel.innerHTML = SHEETS.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
sheetSel.addEventListener('change',()=>{
  state.sheet = SHEETS.find(s=>s.id===sheetSel.value);
  state.person = null; renderOrg(); render();
});

document.getElementById('randPerson').addEventListener('click',()=>{
  const others = state.sheet.people.filter(p=>p!==state.person);
  selectPerson(pick(others).id);
});
['stuCo','stuName'].forEach(id=>document.getElementById(id).addEventListener('input',render));

if (TEACHER){
  document.title = '電話応対 実技（教員用）';
  document.querySelector('header.top h1').textContent = '電話応対 実技（教員用）';
  const sec = document.createElement('section');
  sec.className = 'panel';
  sec.innerHTML = `<h2>出題する伝言（2回目）</h2>
    <div class="mfilter" id="mfilter">${MESSAGES.map((m,i)=>`<label class="mf"><input type="checkbox" value="${i}"><span>${CIRCLED[i]} ${m.title}</span></label>`).join('')}</div>
    <div class="mfbtns"><button class="btn" type="button" id="mfAll">すべて選ぶ</button></div>
    <p class="hint">チェックを外した伝言はランダムで出なくなります（最低1つは残ります）。設定はこのブラウザに保存されます。</p>`;
  const roundPanel = document.getElementById('roundSeg').closest('.panel');
  roundPanel.after(sec);
  const boxes = [...sec.querySelectorAll('input')];
  const sync = () => boxes.forEach(b => b.checked = enabled.includes(Number(b.value)));
  const changed = () => {
    saveEnabled();
    if (state.person && state.round === '2' && !enabled.includes(state.msgIdx)) newMessage();
    render();
  };
  boxes.forEach(b => b.addEventListener('change', () => {
    const i = Number(b.value);
    if (b.checked){ if (!enabled.includes(i)) enabled.push(i); }
    else if (enabled.length > 1) enabled = enabled.filter(x => x !== i);
    else b.checked = true;
    changed();
  }));
  document.getElementById('mfAll').addEventListener('click', () => { enabled = MESSAGES.map((_, i) => i); sync(); changed(); });
  sync();
}
renderOrg();
</script>
</body>
</html>
